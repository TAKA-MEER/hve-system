<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hve 昇降・カメラ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <span class="title">hve 昇降・カメラ</span>
  <span class="badge" id="bLink"><span class="dot"></span><span>昇降部</span></span>
  <span class="badge" id="bCeil"><span class="dot"></span><span>天井 —</span></span>
  <span class="badge" id="bClients"><span>端末 —</span></span>
  <span class="badge warn" id="bProv" style="display:none" title="仮値のまま動いているパラメータがあります"><span class="dot"></span><span>仮値</span></span>
  <span class="badge warn" id="bTop" style="display:none" title="上端の閾値が未設定のため上端で止まりません"><span class="dot"></span><span>上端 未設定（開発中）</span></span>
  <span class="badge fake" id="bFake" style="display:none"><span>偽物のモード</span></span>
  <span class="badge ng" id="bWs" style="display:none" title="カメラ部から状態が届きません。再接続を試みています"><span class="dot"></span><span>接続切れ</span></span>
  <span class="spacer"></span>
  <button class="hbtn" id="openSettings">設定</button>
</header>

<main>
  <div class="video" id="video">
    <!-- 映像は hve_video が送る（protocol §1）。URL は state の video_port から app.js が組む -->
    <img class="frame" id="videoImage" alt="カメラ映像">
    <div class="guide" id="guide"><div class="h"></div><div class="v"></div><div class="box"></div></div>
    <div class="osd"><span id="osdH">高さ —</span><span id="osdP">ピッチ —</span></div>
    <button class="guidebtn" id="toggleGuide" title="ガイド線の表示を切り替える">ガイド線</button>
    <div class="zoom" aria-label="デジタルズーム">
      <button class="zoombtn" id="zIn" title="拡大">＋</button>
      <button class="zoombtn lvl" id="zLvl" title="1 倍に戻す">1.0×</button>
      <button class="zoombtn" id="zOut" title="縮小">−</button>
    </div>
    <div class="nosig" id="nosig">映像がありません</div>
    <div class="stopbar" id="stopbar"></div>
  </div>

  <div class="panel">
    <section class="card">
      <h2><span>昇降</span><span class="st" id="liftState">停止中</span></h2>
      <div class="lift">
        <div class="liftbtns">
          <button class="hold" data-axis="lift_up">▲ 上昇</button>
          <button class="hold" data-axis="lift_down">▼ 下降</button>
        </div>
        <div class="gauge" title="高さ（赤い破線が上端）">
          <div class="fill" id="gFill"></div>
          <div class="top" id="gTop"></div>
        </div>
      </div>
      <div class="sub">速度</div>
      <div class="slider"><label for="sUp">上昇</label><input type="range" id="sUp"><output id="oUp"></output></div>
      <div class="slider"><label for="sDown">下降</label><input type="range" id="sDown"><output id="oDown"></output></div>
    </section>

    <section class="card">
      <h2><span>カメラの向き</span></h2>
      <div class="pad">
        <div></div><button class="hold" data-axis="pitch_up">▲</button><div></div>
        <button class="hold" data-axis="yaw_left">◀</button>
        <div class="c" title="ピッチ（ヨーの向きは扱わない）"><span id="cP">↕ —</span></div>
        <button class="hold" data-axis="yaw_right">▶</button>
        <div></div><button class="hold" data-axis="pitch_down">▼</button><div></div>
      </div>
      <div class="sub">速度</div>
      <div class="slider"><label for="sPitch">ピッチ</label><input type="range" id="sPitch"><output id="oPitch"></output></div>
      <div class="slider"><label for="sYaw">ヨー</label><input type="range" id="sYaw"><output id="oYaw"></output></div>
    </section>
  </div>
</main>

<!-- 設定画面（同じページの中に出る別画面。names §1） -->
<div class="overlay" id="settings">
  <div class="sheet" role="dialog" aria-labelledby="stTitle">
    <h1 id="stTitle">設定</h1>
    <p class="note">機器（カメラ部）に保存され、どの端末から開いても同じ設定になります。誰でも変更できます。
      スライダーの位置は保存されず、画面を開くたびに<b>初期値</b>から始まります。</p>
    <table>
      <thead><tr><th>速度</th><th>下限</th><th>上限</th><th>初期値</th><th>単位</th></tr></thead>
      <tbody id="stBody"></tbody>
    </table>
    <div class="err" id="stErr"></div>
    <div class="row-actions">
      <button class="hbtn" id="stCancel">閉じる（保存しない）</button>
      <button class="hbtn primary" id="stSave">保存</button>
    </div>
    <div class="prov" id="stProv"></div>
  </div>
</div>
<div class="toast" id="toast">保存しました</div>

<script src="settings.js"></script>
<script src="app.js"></script>
</body>
</html>
