; ============================================================
; カメラ部の Arduino ファーム (UNO)
;   pio test -d firmware/cam_io -e native   ホストの試験（判定はここ）
;   pio run  -d firmware/cam_io -e uno       実機向けのビルド
; 詳細は DetailedDesign.md §4.5・DetailedDesign-names.md §1
; ============================================================

[env:uno]
platform  = atmelavr@5.3.0
board     = uno
framework = arduino
monitor_speed = 115200
lib_deps =
  arduino-libraries/Servo@1.3.0

[env:native]
platform = native
test_framework = unity
