; ============================================================
; 昇降部ファーム (ESP32)
;   pio test -d firmware/lift -e native     ホストの試験（判定はここ）
;   pio run  -d firmware/lift -e esp32dev   実機向けのビルド
; 詳細は DetailedDesign.md §4.1・DetailedDesign-names.md §1
; ============================================================

[env:esp32dev]
platform  = espressif32@7.0.1
board     = esp32dev
framework = arduino
monitor_speed = 115200
; 版を固定する（先行試作 ../elevator-motor-control と同じ組み合わせ）
; 画面（web/）はビルド前に gzip して src/web_assets.h（生成物）へ埋め込む
extra_scripts = pre:scripts/embed_web.py
; src/manual/ は組み立て用ファーム（下の env:esp32dev_manual）なので外す
build_src_filter = +<*> -<manual/>
lib_deps =
    ESP32Async/ESPAsyncWebServer @ 3.12.1
    ESP32Async/AsyncTCP @ 3.5.0
    bblanchon/ArduinoJson @ 7.4.3

; 組み立て用ファーム（台帳 W-2）。スイッチでモータを回すだけで、安全装置は効かない。
;   pio run -d firmware/lift -e esp32dev_manual -t upload
; 組み立てが終わったら env:esp32dev を書き戻す
[env:esp32dev_manual]
platform  = espressif32@7.0.1
board     = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<manual/>
; hal_core（デューティの PWM 化）が lift_core を引き、lift_core の cmd_codec が使う
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3

[env:native]
platform = native
test_framework = unity
; 後のパケットで cmd_codec（JSON ⇔ 構造体）が使う
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
