[pytest]
# リポジトリ直下から .venv/bin/python -m pytest と打ったときに
# hve_camera / hve_video を import できるようにする（camera/ を rootdir に加える）。
# tools/ も入れて、tools/tests が tools/lift_probe.py を import できるようにする。
pythonpath = camera tools
testpaths = camera/tests tools/tests
# aiohttp の試験クライアントは非同期の試験関数（WP-VIDEO-01 で必要）。
# pytest-aiohttp は pytest-asyncio が実行するので、自動モードにしておく。
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
