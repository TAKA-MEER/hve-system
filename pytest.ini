[pytest]
# リポジトリ直下から .venv/bin/python -m pytest camera/tests と打ったときに
# hve_camera / hve_video を import できるようにする（camera/ を rootdir に加える）。
pythonpath = camera
testpaths = camera/tests
# aiohttp の試験クライアントは非同期の試験関数（WP-VIDEO-01 で必要）。
# pytest-aiohttp は pytest-asyncio が実行するので、自動モードにしておく。
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
